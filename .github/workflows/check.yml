name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run fast checks
        run: ./scripts/check.sh --fast

      - name: Docs check
        run: python3 scripts/check-docs.py

      - name: Complexity gate
        run: |
          if git rev-parse --verify --quiet origin/main; then
            python3 scripts/complexity.py --changed origin/main
          else
            python3 scripts/complexity.py --changed HEAD^
          fi
