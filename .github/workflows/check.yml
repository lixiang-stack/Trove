name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run fast checks
        run: ./scripts/check.sh --fast

      - name: SQLite diagnostics
        # FTS5 failures under xdist are hard to diagnose without the SQLite build.
        if: failure()
        run: |
          uv run python - <<'PY'
          import sqlite3
          import sys

          print("python:", sys.version)
          print("sqlite:", sqlite3.sqlite_version)
          with sqlite3.connect(":memory:") as db:
              options = [
                  row[0]
                  for row in db.execute("pragma compile_options")
                  if "FTS5" in row[0]
              ]
          print("fts5:", options or "missing")
          PY

      - name: Docs check
        run: python3 scripts/check-docs.py

      - name: Complexity gate
        run: |
          if git rev-parse --verify --quiet origin/main; then
            python3 scripts/complexity.py --changed origin/main
          else
            python3 scripts/complexity.py --changed HEAD^
          fi
