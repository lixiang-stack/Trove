[project]
name = "trove"
version = "0.1.0"
description = "Personal long-content library host"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "feedparser>=6.0.11",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "lxml>=5.3",
  "nh3>=0.2.20",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-sdk>=1.28",
  "prometheus-client>=0.21",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "starlette>=0.49.1",
  "uvicorn[standard]>=0.34",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
asr = [
  "funasr>=1.4.29,<2",
  "modelscope>=1.20,<2",
  "torch>=2.2",
  "torchaudio>=2.2",
]

[dependency-groups]
dev = [
  "import-linter>=2.17",
  "mypy>=1.14",
  "playwright>=1.49",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.9",
]

[project.scripts]
trove = "trove.cli:main"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not slow'"
markers = [
  "network: hits real external services",
  "browser: requires a Playwright browser",
  "ffmpeg: requires real FFmpeg/ffprobe integration",
  "slow: manual integration test with a downloaded model",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src/trove"]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.importlinter]
root_package = "trove"

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers"
type = "forbidden"
source_modules = ["trove.domain"]
forbidden_modules = ["trove.services", "trove.adapters", "trove.web", "trove.db"]

[[tool.importlinter.contracts]]
name = "Services do not depend on HTTP or adapter implementations"
type = "forbidden"
source_modules = ["trove.services"]
forbidden_modules = ["trove.web", "trove.adapters"]

[[tool.importlinter.contracts]]
name = "Adapters do not depend on services or HTTP"
type = "forbidden"
source_modules = ["trove.adapters"]
forbidden_modules = ["trove.services", "trove.web"]

[[tool.importlinter.contracts]]
name = "Core layers do not depend on entry points or composition"
type = "forbidden"
source_modules = ["trove.domain", "trove.services", "trove.adapters"]
forbidden_modules = [
  "trove.app",
  "trove.benchmarks",
  "trove.cli",
  "trove.composition",
  "trove.deploy",
  "trove.evaluation",
  "trove.worker",
]

[[tool.importlinter.contracts]]
name = "Web does not depend on adapter implementations"
type = "forbidden"
source_modules = ["trove.web"]
forbidden_modules = ["trove.adapters"]
allow_indirect_imports = true

# Web reads Run/Item and health state through services; keep direct DB access out
# of the HTTP layer.
[[tool.importlinter.contracts]]
name = "Web does not depend on the database"
type = "forbidden"
source_modules = ["trove.web"]
forbidden_modules = ["trove.db"]
allow_indirect_imports = true
