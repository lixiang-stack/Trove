[project]
name = "trove"
version = "0.1.0"
description = "Personal long-content library host"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "feedparser>=6.0.11",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "lxml>=5.3",
  "nh3>=0.2.20",
  "pydantic>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "starlette>=0.49.1",
  "uvicorn[standard]>=0.34",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
asr = ["mlx-whisper>=0.4"]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "playwright>=1.49",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.9",
]

[project.scripts]
trove = "trove.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not slow'"
markers = [
  "network: hits real external services",
  "browser: requires a Playwright browser",
  "ffmpeg: requires real FFmpeg/ffprobe integration",
  "slow: manual integration test with a downloaded model",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src/trove"]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
